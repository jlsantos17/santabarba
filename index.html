<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SANTABARBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#181613;
  --ink-soft:#242019;
  --graphite:#3A362D;
  --ivory:#F2EEE6;
  --ivory-dim:#E4DED0;
  --rust:#8C4B32;
  --rust-deep:#623020;
  --champagne:#B7AB96;
  --line-dark:rgba(242,238,230,0.16);
  --line-light:rgba(24,22,19,0.14);
  --ok:#5C7A55;
  --danger:#A3402F;
  --font-display:'Newsreader', serif;
  --font-brand:'Rye', 'Newsreader', serif;
  --font-sans:'Work Sans', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:70px}
html,body{height:100%}
body{
  margin:0;
  background:var(--ivory);
  color:var(--ink);
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.overflow-x{overflow-x:auto}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--font-display);font-weight:500;margin:0;letter-spacing:-0.01em}
.eyebrow-free{}
.section-title{font-size:clamp(28px,4vw,42px);line-height:1.1;margin-bottom:14px}
.section-lede{max-width:52ch;color:inherit;opacity:0.78;font-size:16px}
.mono-note{font-family:var(--font-sans);font-size:13px;letter-spacing:0.02em;opacity:0.6}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:2px;border:1px solid transparent;
  font-size:14.5px;font-weight:600;letter-spacing:0.01em;
  transition:background .18s ease, color .18s ease, border-color .18s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--rust);color:var(--ivory);border-color:var(--rust)}
.btn-primary:hover{background:var(--rust-deep);border-color:var(--rust-deep)}
.btn-ghost-dark{background:transparent;color:var(--ivory);border-color:var(--line-dark)}
.btn-ghost-dark:hover{border-color:var(--ivory)}
.btn-ghost-light{background:transparent;color:var(--ink);border-color:var(--line-light)}
.btn-ghost-light:hover{border-color:var(--ink)}
.btn-small{padding:9px 16px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:0.4;cursor:not-allowed}
.btn-danger{background:transparent;color:var(--danger);border-color:rgba(163,64,47,0.4)}
.btn-danger:hover{background:rgba(163,64,47,0.08)}

/* ---------- Header ---------- */
#site-header{
  position:sticky;top:0;z-index:40;
  background:rgba(22,20,15,0.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-dark);
}
.header-row{display:flex;align-items:center;justify-content:space-between;height:76px;color:var(--ivory)}
.wordmark{font-family:var(--font-brand);font-size:22px;letter-spacing:0.03em;display:flex;align-items:baseline;gap:9px}
.est-badge{font-family:var(--font-sans);font-size:10.5px;letter-spacing:0.06em;color:var(--champagne);opacity:0.85;font-weight:500}
@media (max-width:520px){.est-badge{display:none}}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a{font-size:14px;opacity:0.86}
.nav-links a:hover{opacity:1}
.header-actions{display:flex;align-items:center;gap:18px}
.burger{display:none;background:none;border:none;color:var(--ivory);padding:8px}
.burger svg{width:24px;height:24px}
.mobile-menu{display:none;flex-direction:column;gap:0;background:var(--ink);border-bottom:1px solid var(--line-dark)}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--ivory);padding:16px 24px;border-top:1px solid var(--line-dark);font-size:15px}
@media (max-width:860px){
  .nav-links{display:none}
  .burger{display:inline-flex}
}

/* ---------- Hero ---------- */
.hero{background:var(--ink);color:var(--ivory);padding:96px 0 84px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center}
.hero-since{font-size:13px;letter-spacing:0.05em;color:var(--champagne);opacity:0.9;margin:0 0 14px}
.hero-name{font-family:var(--font-brand);font-size:clamp(48px,8.5vw,100px);line-height:0.9;letter-spacing:0.01em;margin:0 0 22px}
.hero-tag{font-size:18px;max-width:34ch;opacity:0.82;margin-bottom:38px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.hero-art{justify-self:end}
.hero-art svg{width:100%;max-width:340px;height:auto}
@media (max-width:860px){
  .hero{padding:64px 0 56px}
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero-art{justify-self:start;order:-1;opacity:0.9}
  .hero-art svg{max-width:180px}
}

/* ---------- Sections generic ---------- */
section{padding:88px 0}
@media (max-width:640px){section{padding:56px 0}}
.section-dark{background:var(--ink);color:var(--ivory)}
.section-head{margin-bottom:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.rule{height:1px;background:var(--line-light);border:none;margin:0}
.rule-dark{background:var(--line-dark)}

/* ---------- Services ---------- */
.svc-categories{display:grid;grid-template-columns:repeat(2,1fr);gap:44px 56px}
.svc-cat-title{font-family:var(--font-display);font-style:italic;font-size:20px;margin-bottom:6px;color:var(--rust-deep)}
.svc-list{border-top:1px solid var(--line-light)}
.svc-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-light);color:var(--ink)}
.svc-row:hover .svc-row-name{color:var(--rust-deep)}
.svc-row-name{font-size:15.5px;font-weight:500;transition:color .15s ease}
.svc-row-desc{display:block;font-size:12.5px;opacity:0.6;font-weight:400;margin-top:2px}
.svc-row-meta{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.svc-row-duration{font-size:12px;opacity:0.55}
.svc-row-price{font-size:15px;font-weight:600}
.svc-row-cta{font-size:12px;color:var(--rust-deep);font-weight:600;opacity:0;transition:opacity .15s ease}
.svc-row:hover .svc-row-cta{opacity:1}
@media (max-width:760px){.svc-categories{grid-template-columns:1fr;gap:32px}.svc-row-cta{display:none}}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:center}
.about-year{border-right:1px solid var(--line-dark);padding-right:40px}
.about-year-label{display:block;font-size:13px;letter-spacing:0.08em;opacity:0.6;text-transform:uppercase;margin-bottom:6px}
.about-year-num{font-family:var(--font-display);font-size:clamp(48px,7vw,72px);line-height:1;color:var(--champagne)}
.about-quote{font-family:var(--font-display);font-style:italic;font-size:clamp(22px,3vw,30px);line-height:1.4;max-width:34ch;margin:0 0 20px}
.about-body{max-width:56ch;opacity:0.7;font-size:15px}
@media (max-width:760px){
  .about-grid{grid-template-columns:1fr;gap:26px}
  .about-year{border-right:none;border-bottom:1px solid var(--line-dark);padding-right:0;padding-bottom:20px;display:flex;align-items:baseline;gap:12px}
}

/* ---------- Differentials ---------- */
.diff-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.diff-item{padding:26px 28px;border-left:1px solid var(--line-light)}
.diff-item:first-child{border-left:none;padding-left:0}
.diff-item h3{font-size:18px;margin-bottom:10px;font-family:var(--font-sans);font-weight:600}
.diff-item p{margin:0;font-size:14.5px;opacity:0.72}
@media (max-width:760px){
  .diff-list{grid-template-columns:1fr}
  .diff-item{border-left:none;border-top:1px solid var(--line-light);padding-left:0}
  .diff-item:first-child{border-top:none}
}

/* ---------- Booking ---------- */
.book-card{background:var(--ink);color:var(--ivory);padding:0;border:1px solid var(--line-dark)}
.book-progress{display:flex;border-bottom:1px solid var(--line-dark)}
.book-step{flex:1;padding:16px 18px;font-size:12.5px;letter-spacing:0.02em;opacity:0.4;border-bottom:2px solid transparent;text-align:center}
.book-step.active{opacity:1;border-color:var(--rust)}
.book-step.done{opacity:0.75}
.book-body{padding:36px}
@media (max-width:640px){.book-body{padding:24px 18px}.book-progress{flex-wrap:wrap}.book-step{flex:1 1 33%;font-size:11px;padding:10px 6px}}
.field-label{display:block;font-size:13px;margin-bottom:8px;opacity:0.8}
.field-input{width:100%;padding:13px 14px;background:transparent;border:1px solid var(--line-dark);color:var(--ivory);border-radius:2px}
.field-input:focus{outline:none;border-color:var(--champagne)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:520px){.field-row{grid-template-columns:1fr}}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.pick-tile{border:1px solid var(--line-dark);padding:16px;border-radius:2px;text-align:left;background:transparent;color:var(--ivory)}
.pick-tile:hover{border-color:var(--champagne)}
.pick-tile.selected{border-color:var(--rust);background:rgba(170,95,52,0.14)}
.pick-tile .t-name{font-family:var(--font-display);font-size:17px;display:block;margin-bottom:4px}
.pick-tile .t-meta{font-size:12.5px;opacity:0.65}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line-dark);padding:10px 6px;text-align:center;border-radius:2px;background:transparent;color:var(--ivory);font-size:13.5px}
.slot:hover{border-color:var(--champagne)}
.slot.selected{border-color:var(--rust);background:rgba(170,95,52,0.18)}
.empty-note{opacity:0.6;font-size:14px;padding:20px 0}
.book-step-title{font-family:var(--font-display);font-size:22px;margin-bottom:20px}
.booking-summary-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 16px;margin-bottom:26px;
  background:rgba(217,199,160,0.08);border:1px solid var(--line-dark);border-left:2px solid var(--champagne);
}
.bsb-label{font-size:11.5px;letter-spacing:0.05em;opacity:0.65;text-transform:uppercase;display:block;margin-bottom:2px}
.bsb-service{font-family:var(--font-display);font-size:17px;color:var(--champagne)}
.bsb-meta{font-size:13px;opacity:0.75}
.bsb-change{background:none;border:1px solid var(--line-dark);color:var(--ivory);font-size:12.5px;padding:8px 14px;border-radius:2px;white-space:nowrap}
.bsb-change:hover{border-color:var(--champagne)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month-label{font-family:var(--font-display);font-size:17px}
.cal-nav{background:none;border:1px solid var(--line-dark);color:var(--ivory);width:34px;height:34px;border-radius:2px;font-size:16px}
.cal-nav:hover{border-color:var(--champagne)}
.cal-nav[disabled]{opacity:0.25;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11.5px;opacity:0.5;padding-bottom:4px}
.cal-cell{aspect-ratio:1;border:1px solid var(--line-dark);background:transparent;color:var(--ivory);border-radius:2px;font-size:13.5px}
.cal-cell.empty{border:none;background:none}
.cal-cell:not(.disabled):not(.empty):hover{border-color:var(--champagne)}
.cal-cell.disabled{opacity:0.22;text-decoration:line-through;cursor:not-allowed}
.cal-cell.today{border-color:var(--champagne)}
.cal-cell.selected{background:var(--rust);border-color:var(--rust);color:var(--ivory)}
.svc-pick-list{display:flex;flex-direction:column;border-top:1px solid var(--line-dark);margin-bottom:8px}
.svc-pick-card{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line-dark)}
.svc-pick-card.selected{background:rgba(170,95,52,0.1)}
.svc-pick-info{display:flex;flex-direction:column;gap:3px}
.svc-pick-name{font-family:var(--font-display);font-size:18px}
.svc-pick-desc{font-size:13px;opacity:0.65}
.svc-pick-meta{font-size:13.5px;color:var(--champagne);margin-top:2px}
@media (max-width:560px){.svc-pick-card{flex-direction:column;align-items:flex-start}}
.confirm-checklist{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:10px}
.confirm-checklist li{font-size:15px}
.confirm-checklist li b{font-weight:600}
.book-nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.confirm-ticket{border:1px dashed var(--line-dark);padding:24px;margin-top:6px}
.confirm-ticket.on-light{border-color:var(--line-light)}
.confirm-ticket.on-light .confirm-row{border-bottom-color:var(--line-light)}
.confirm-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-dark);font-size:14.5px}
.confirm-row:last-child{border-bottom:none}
.confirm-row b{font-weight:600}
.success-mark{font-family:var(--font-display);font-style:italic;font-size:28px;margin-bottom:6px}

/* ---------- Location / Contact ---------- */
.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.loc-info dt{font-size:12.5px;opacity:0.55;margin-top:20px}
.loc-info dt:first-child{margin-top:0}
.loc-info dd{margin:4px 0 0;font-size:16px}
.map-frame{width:100%;height:340px;border:1px solid var(--line-dark);filter:grayscale(0.35) contrast(1.05)}
.map-empty{width:100%;height:340px;border:1px solid var(--line-dark);display:flex;align-items:center;justify-content:center;opacity:0.55;font-size:14px;text-align:center;padding:20px}
@media (max-width:860px){.loc-grid{grid-template-columns:1fr}}

.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line-light)}
.contact-item{padding:26px;border-left:1px solid var(--line-light)}
.contact-item:first-child{border-left:none}
.contact-item h3{font-size:14px;font-weight:600;margin-bottom:10px}
.contact-item a,.contact-item p{font-size:14.5px;opacity:0.8;margin:0}
@media (max-width:760px){.contact-grid{grid-template-columns:1fr}.contact-item{border-left:none;border-top:1px solid var(--line-light)}.contact-item:first-child{border-top:none}}

/* ---------- Footer ---------- */
footer{background:var(--ink);color:var(--ivory);padding:56px 0 34px}
.footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:32px;padding-bottom:36px;border-bottom:1px solid var(--line-dark)}
.footer-name{font-family:var(--font-brand);font-size:28px}
.footer-cols{display:flex;gap:64px;flex-wrap:wrap}
.footer-col a,.footer-col span{display:block;font-size:14px;opacity:0.75;margin-bottom:10px}
.footer-col h4{font-size:12.5px;opacity:0.5;margin:0 0 14px;font-weight:600}
.footer-bottom{padding-top:22px;font-size:12.5px;opacity:0.5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* ---------- Admin shared ---------- */
.admin-shell{min-height:100%;background:var(--ivory-dim)}
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px}
.admin-login-box{width:100%;max-width:380px;color:var(--ivory)}
.admin-topbar{background:var(--ink);color:var(--ivory);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;position:sticky;top:0;z-index:30}
.admin-body{display:flex;min-height:calc(100vh - 64px)}
.admin-side{width:220px;background:var(--ink-soft);color:var(--ivory);padding:20px 0;flex-shrink:0}
.admin-side a{display:block;padding:12px 24px;font-size:14px;opacity:0.7;border-left:2px solid transparent}
.admin-side a.active{opacity:1;border-color:var(--rust);background:rgba(255,255,255,0.04)}
.admin-main{flex:1;padding:32px;min-width:0}
@media (max-width:820px){
  .admin-body{flex-direction:column}
  .admin-side{width:100%;display:flex;overflow-x:auto;padding:8px}
  .admin-side a{padding:10px 16px;white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .admin-side a.active{border-color:var(--rust)}
  .admin-main{padding:18px}
}
.card{background:#fff;border:1px solid var(--line-light);padding:22px;margin-bottom:20px}
.card h3{font-family:var(--font-sans);font-weight:600;font-size:15px;margin-bottom:16px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-light);border:1px solid var(--line-light);margin-bottom:24px}
.kpi{background:#fff;padding:20px}
.kpi .n{font-family:var(--font-display);font-size:32px;display:block}
.kpi .l{font-size:12.5px;opacity:0.6}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;opacity:0.55;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-light)}
td{padding:10px 10px;border-bottom:1px solid var(--line-light);vertical-align:middle}
.tag{display:inline-block;padding:3px 9px;font-size:11.5px;border-radius:20px;font-weight:600}
.tag-pending{background:#EFE3CE;color:#7A5A20}
.tag-confirmed{background:#DCE7D8;color:#3E5C38}
.tag-done{background:#DCE3EE;color:#354A66}
.tag-cancelled{background:#EFDAD5;color:#8A3B27}
.tag-noshow{background:#E7E7E2;color:#5A574E}
.tag-row{display:flex;flex-wrap:wrap;gap:8px}
.next-client-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:14.5px}
.next-client-row .nc-time{font-family:var(--font-display);font-size:22px;color:var(--rust-deep)}
.next-client-row .nc-name{font-weight:600}
.next-client-row .nc-service{opacity:0.7}
.next-client-row .nc-price{font-weight:600}
.day-tabs{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.day-tab{padding:8px 16px;border:1px solid var(--line-light);background:#fff;font-size:13.5px;border-radius:2px}
.day-tab.active{border-color:var(--rust);color:var(--rust-deep);font-weight:600}
.week-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.week-day{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line-light);background:#fff;border-radius:2px;font-size:12.5px;display:flex;flex-direction:column;gap:2px;text-align:center}
.week-day.active{border-color:var(--rust);color:var(--rust-deep)}
.agenda-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.agenda-slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:2px;font-size:13.5px}
.agenda-slot.free{background:#F6F6F2;color:#9A9689}
.agenda-slot.break{background:#F0ECE2;color:#8A7F63}
.agenda-slot.blocked{background:#F1E4DE;color:#8A5A44}
.agenda-slot.booking{border:1px solid var(--line-light);background:#fff;width:100%;text-align:left;cursor:pointer;border-left:4px solid var(--ok)}
.agenda-slot.booking.status-pending{border-left-color:#B98A2E}
.agenda-slot.booking.status-confirmed{border-left-color:var(--ok)}
.agenda-slot.booking.status-done{border-left-color:#3E5C7A}
.agenda-slot.booking.status-cancelled{border-left-color:var(--danger);opacity:0.55}
.agenda-slot.booking.status-no_show{border-left-color:#9A9689;opacity:0.7}
.ab-time{font-weight:600;min-width:96px}
.ab-main{flex:1;display:flex;flex-direction:column;text-align:left}
.ab-name{font-weight:600}
.ab-service{font-size:12.5px;opacity:0.65}
.ab-price{font-weight:600;white-space:nowrap}
.ab-status{font-size:14px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-label{display:block;font-size:12.5px;opacity:0.65;margin-bottom:6px}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--line-light);border-radius:2px;font-size:14px}
.form-input:focus{outline:none;border-color:var(--rust)}

========================================================= */

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) { const d = defaultData(); saveData(d); return d; }
    const parsed = JSON.parse(raw);
    return parsed;
  }catch(e){
    const d = defaultData(); saveData(d); return d;
  }
}
function saveData(d){
  localStorage.setItem(STORE_KEY, JSON.stringify(d));
}
let DATA = loadData();
function persist(){ saveData(DATA); }

/* ---------- utils ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function onlyDigits(s){ return String(s||'').replace(/\D/g,''); }
function fmtPrice(v, priceFrom){ return (priceFrom?'A partir de ':'') + 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
function fmtDurationMin(m){
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), rest = m%60;
  return rest ? (h+'h'+pad2(rest)) : (h+'h');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
}
const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
function dowKeyFromISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return DOW_KEYS[new Date(y,m-1,d).getDay()];
}
function toast(msg){
  const holder = document.getElementById('toast-holder');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  holder.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}
function waLink(number, text){
  const digits = onlyDigits(number);
  if(!digits) return '';
  let full = digits;
  if(!full.startsWith('55')) full = '55' + full;
  return 'https://wa.me/'+full+(text ? ('?text='+encodeURIComponent(text)) : '');
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* =========================================================

========================================================= */
function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  if(route.startsWith('/admin')){
    app.innerHTML = renderAdminRoot();
    wireAdmin();
  } else {
    app.innerHTML = renderPublicRoot(route);
    wirePublic();
    if(route === '/agendar'){
      const el = document.getElementById('agendar');
      if(el) window.scrollTo(0,0);
    }
  }
}

/* ---------- BOOKING ---------- */
function generateSlots(dateISO, service, excludeBookingId){
  const hours = DATA.config.hours;
  const dow = dowKeyFromISO(dateISO);
  const day = hours[dow];
  if(!day || day.closed) return [];
  if(DATA.closedDates.includes(dateISO)) return [];
  const [openH, openM] = day.open.split(':').map(Number);
  const [closeH, closeM] = day.close.split(':').map(Number);
  let cursor = openH*60+openM;
  const end = closeH*60+closeM;
  const dur = service ? service.duration : 30;
  const slots = [];
  const now = new Date();
  const isToday = isoDate(now) === dateISO;
  const nowMinutes = now.getHours()*60+now.getMinutes();

  const breakStart = day.breakStart ? toMin(day.breakStart) : null;
  const breakEnd = day.breakEnd ? toMin(day.breakEnd) : null;

  while(cursor + dur <= end){
    const slotStart = cursor;
    const slotEnd = cursor + dur;
    let blocked = false;
    if(breakStart!=null && breakEnd!=null && overlaps(slotStart,slotEnd,breakStart,breakEnd)) blocked = true;
    if(isToday && slotStart <= nowMinutes) blocked = true;
    if(!blocked){
      for(const b of DATA.blocks){
        if(b.date === dateISO && overlaps(slotStart, slotEnd, toMin(b.start), toMin(b.end))){ blocked = true; break; }
      }
    }
    if(!blocked){
      for(const bk of DATA.bookings){
        if(bk.id === excludeBookingId) continue;
        if(bk.date === dateISO && bk.status !== 'cancelled'){
          const bkService = DATA.services.find(s=>s.id===bk.serviceId);
          const bkDur = bkService ? bkService.duration : 30;
          const bkStart = toMin(bk.time);
          const bkEnd = bkStart + bkDur;
          if(overlaps(slotStart, slotEnd, bkStart, bkEnd)){ blocked = true; break; }
        }
      }
    }
    if(!blocked){
      slots.push(minToTime(slotStart));
    }
    cursor += 30;
  }
  return slots;
}
function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function minToTime(min){ return pad2(Math.floor(min/60))+':'+pad2(min%60); }
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; }

function next14Days(){
  const days = [];
  const today = new Date();
  for(let i=0;i<14;i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    days.push(isoDate(d));
  }
  return days;
}

function bookingCtaLabel(name){
  return name.length <= 16 ? ('Agendar ' + name) : 'Escolher serviço';

  return hasBarbers

}

  const map = {service:'Serviço', barber:'Profissional', date:'Data', time:'Horário', contact:'Seus dados', review:'Resumo'};
  return bookingStepKinds(hasBarbers).map(k=>map[k]);
}

}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function renderCalendar(service){
  const b = UI.booking;
  const today = new Date();
  if(b.calY==null){ b.calY = today.getFullYear(); b.calM = today.getMonth(); }
  const todayISO = isoDate(today);
  const first = new Date(b.calY, b.calM, 1);
  const startWeekday = first.getDay();
  const total = daysInMonth(b.calY, b.calM);
  const monthLabel = capFirst(first.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
  const atCurrentMonth = (b.calY===today.getFullYear() && b.calM===today.getMonth());

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<span class="cal-cell empty"></span>`;
  for(let d=1; d<=total; d++){
    const iso = b.calY+'-'+pad2(b.calM+1)+'-'+pad2(d);
    const isPast = iso < todayISO;
    const dow = DOW_KEYS[new Date(b.calY,b.calM,d).getDay()];
    const closedDay = DATA.config.hours[dow].closed || DATA.closedDates.includes(iso);
    let full = false;
    if(!isPast && !closedDay) full = generateSlots(iso, service).length === 0;
    const disabled = isPast || closedDay || full;
    const isToday = iso === todayISO;
    const isSelected = iso === b.date;
    cells += `<button class="cal-cell ${disabled?'disabled':''} ${isToday?'today':''} ${isSelected?'selected':''}" ${disabled?'disabled':''} data-pick-date="${iso}">${d}</button>`;
  }
  return `
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" ${atCurrentMonth?'disabled':''}>‹</button>
      <span class="cal-month-label">${monthLabel}</span>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid">
      ${['D','S','T','Q','Q','S','S'].map(l=>`<span class="cal-dow">${l}</span>`).join('')}
      ${cells}
    </div>
    <p class="small-note" style="color:var(--ivory);margin-top:10px">Dias em cinza estão fechados ou sem horário disponível.</p>
  `;
}

  if(kind === 'service'){
    if(!activeServices.length) return `<p class="empty-note" style="color:var(--ivory)">Nenhum serviço disponível no momento.</p>`;
    return `
      <h3 class="book-step-title">O que você quer fazer?</h3>
      <div class="svc-pick-list">
        ${activeServices.map(s=>`
          <div class="svc-pick-card ${b.serviceId===s.id?'selected':''}" data-pick-service="${s.id}">
            <div class="svc-pick-info">
              <span class="svc-pick-name">${esc(s.name)}</span>
              ${s.description ? `<span class="svc-pick-desc">${esc(s.description)}</span>` : ''}
              <span class="svc-pick-meta">${fmtPrice(s.price, s.priceFrom)} · ${fmtDurationMin(s.duration)}</span>
            </div>
            <button class="btn btn-ghost-dark btn-small" data-pick-service="${s.id}">${esc(agendarLabel(s.name))}</button>
          </div>
        `).join('')}
      </div>`;
  }

  const summaryBar = renderBookingSummaryBar(service, kind !== 'review');

  if(kind === 'barber'){
    return `
      ${summaryBar}
      <h3 class="book-step-title">Com quem você quer agendar?</h3>

function icsDataUrl(bk, service){
  const [y,m,d] = bk.date.split('-').map(Number);
  const [hh,mm] = bk.time.split(':').map(Number);
  const start = new Date(y, m-1, d, hh, mm);
  const end = new Date(start.getTime() + (service?service.duration:30)*60000);
  const fmt = dt => dt.getFullYear()+pad2(dt.getMonth()+1)+pad2(dt.getDate())+'T'+pad2(dt.getHours())+pad2(dt.getMinutes())+'00';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:SANTABARBA - '+(service?service.name:'Agendamento'),
    'DTSTART:'+fmt(start), 'DTEND:'+fmt(end),
    'DESCRIPTION:Agendamento na SANTABARBA'+(bk.barber?(' com '+bk.barber):''),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function renderHoursSummary(){
  const h = DATA.config.hours;
  const labels = {mon:'Seg',tue:'Ter',wed:'Qua',thu:'Qui',fri:'Sex',sat:'Sáb',sun:'Dom'};
  const groups = [];
  ['mon','tue','wed','thu','fri','sat','sun'].forEach(k=>{
    const d = h[k];
    const txt = d.closed ? 'Fechado' : `${d.open} – ${d.close}`;
    const last = groups[groups.length-1];
    if(last && last.txt === txt){ last.days.push(labels[k]); } else { groups.push({txt, days:[labels[k]]}); }
  });
  return groups.map(g => `${g.days[0]}${g.days.length>1?'–'+g.days[g.days.length-1]:''}: ${g.txt}`).join(' · ');
}

  }));

  const backBtn = document.getElementById('bookBack');
  if(backBtn) backBtn.addEventListener('click', ()=>{ UI.booking.step -= 1; render(); });

  const changeSvcBtn = document.getElementById('bookChangeService');
  if(changeSvcBtn) changeSvcBtn.addEventListener('click', ()=>{
    UI.booking.step = 1; UI.booking.serviceId = null; UI.booking.date = null; UI.booking.time = null; render();
  });

  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    UI.booking.calM -= 1;
    if(UI.booking.calM < 0){ UI.booking.calM = 11; UI.booking.calY -= 1; }
    render();
  });
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.addEventListener('click', ()=>{
    UI.booking.calM += 1;
    if(UI.booking.calM > 11){ UI.booking.calM = 0; UI.booking.calY += 1; }
    render();
  });

  const phoneInput = document.getElementById('bookPhone');
  const nameInput = document.getElementById('bookName');
  if(phoneInput){
    phoneInput.addEventListener('input', ()=>{
      UI.booking.phone = phoneInput.value;
      const digits = onlyDigits(phoneInput.value);
      if(digits.length >= 10 && DATA.clients[digits] && !nameInput.value){
        nameInput.value = DATA.clients[digits].name;
        UI.booking.name = DATA.clients[digits].name;
      }
    });
  }
  if(nameInput) nameInput.addEventListener('input', ()=>{ UI.booking.name = nameInput.value; });

  const toReviewBtn = document.getElementById('bookToReview');
  if(toReviewBtn) toReviewBtn.addEventListener('click', ()=>{
    const phoneVal = phoneInput ? phoneInput.value.trim() : '';
    const nameVal = nameInput ? nameInput.value.trim() : '';
    const digits = onlyDigits(phoneVal);
    if(digits.length < 10){ toast('Informe um telefone válido.'); return; }
    if(!nameVal){ toast('Informe seu nome.'); return; }
    UI.booking.phone = phoneVal;
    UI.booking.name = nameVal;
    UI.booking.step += 1;
    render();
  });

  const confirmBtn = document.getElementById('bookConfirm');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
    const b = UI.booking;
    const digits = onlyDigits(b.phone);
    const id = uid();
    DATA.bookings.push({
      id, serviceId:b.serviceId, barber:b.barber||null, date:b.date, time:b.time,
      name:b.name, phone:digits, status:'confirmed', contacted:false, createdAt:Date.now()
    });
    DATA.clients[digits] = { name:b.name, phone:digits };
    persist();
    UI.booking.done = true;
    UI.booking.createdId = id;
    render();
    const el = document.getElementById('agendar'); if(el) el.scrollIntoView({block:'start'});
  });

  const againBtn = document.getElementById('bookAnother');
  if(againBtn) againBtn.addEventListener('click', ()=>{
    UI.booking = { step:1, serviceId:null, barber:null, date:null, time:null, name:'', phone:'', done:false, createdId:null };
    render();
  });
}

function computeDayAgenda(dateISO){
  const dow = dowKeyFromISO(dateISO);
  const day = DATA.config.hours[dow];
  const closed = day.closed || DATA.closedDates.includes(dateISO);
  if(closed) return {closed:true, items:[]};
  const openMin = toMin(day.open), closeMin = toMin(day.close);
  const bookings = DATA.bookings.filter(b=>b.date===dateISO && b.status!=='cancelled');
  let busy = [];
  bookings.forEach(b=>{
    const s = DATA.services.find(x=>x.id===b.serviceId);
    const dur = s ? s.duration : 30;
    busy.push({start:toMin(b.time), end:toMin(b.time)+dur, booking:b});
  });
  DATA.blocks.filter(x=>x.date===dateISO).forEach(bl=>{
    busy.push({start:toMin(bl.start), end:toMin(bl.end), block:bl});
  });
  if(day.breakStart && day.breakEnd){
    busy.push({start:toMin(day.breakStart), end:toMin(day.breakEnd), isBreak:true});
  }
  busy.sort((a,b)=>a.start-b.start);
  const items = [];
  let cursor = openMin;
  busy.forEach(seg=>{
    if(seg.start > cursor + 4){ items.push({type:'free', start:cursor, end:seg.start}); }
    if(seg.booking) items.push({type:'booking', data:seg.booking, start:seg.start, end:seg.end});
    else if(seg.block) items.push({type:'block', data:seg.block, start:seg.start, end:seg.end});
    else if(seg.isBreak) items.push({type:'break', start:seg.start, end:seg.end});
    cursor = Math.max(cursor, seg.end);
  });
  if(cursor < closeMin) items.push({type:'free', start:cursor, end:closeMin});
  return {closed:false, items};
}

function next7Days(){

function agendaBlockHtml(item){
  if(item.type === 'free'){
    const mins = item.end - item.start;
    if(mins < 5) return '';
    return `<div class="agenda-slot free"><span>${minToTime(item.start)}–${minToTime(item.end)}</span><span class="small-note">Livre</span></div>`;
  }
  if(item.type === 'break'){
    return `<div class="agenda-slot break"><span>${minToTime(item.start)}–${minToTime(item.end)}</span><span class="small-note">Intervalo</span></div>`;
  }
  if(item.type === 'block'){
    return `<div class="agenda-slot blocked"><span>${minToTime(item.start)}–${minToTime(item.end)}</span><span class="small-note">Bloqueado${item.data.reason?' · '+esc(item.data.reason):''}</span></div>`;
  }
  const bk = item.data;
  const svc = DATA.services.find(s=>s.id===bk.serviceId);
  const m = STATUS_META[bk.status] || STATUS_META.confirmed;
  return `
    <button class="agenda-slot booking status-${bk.status}" data-bk-view="${bk.id}">
      <span class="ab-time">${minToTime(item.start)}–${minToTime(item.end)}</span>
      <span class="ab-main">
        <span class="ab-name">${esc(bk.name)}</span>
        <span class="ab-service">${svc?esc(svc.name):'—'}${svc?(' · '+fmtDurationMin(svc.duration)):''}</span>
      </span>
      <span class="ab-price">${svc?fmtPrice(svc.price, svc.priceFrom):''}</span>
      <span class="ab-status">${m.emoji}</span>
    </button>`;
}

  if(setupBtn) setupBtn.addEventListener('click', async ()=>{

    const p2 = document.getElementById('setupPass2').value;
    const err = document.getElementById('setupError');
    if(p1.length < 4){ err.textContent = 'Use uma senha com pelo menos 4 caracteres.'; return; }
    if(p1 !== p2){ err.textContent = 'As senhas não coincidem.'; return; }
    const salt = uid()+uid();
    const hash = await sha256Hex(salt+p1);
    DATA.admin = {salt, hash};
    persist();
    UI.admin.authed = true; touchActivity();
    render();
  });

  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.addEventListener('click', async ()=>{
    const p = document.getElementById('loginPass').value;
    const hash = await sha256Hex(DATA.admin.salt + p);
    if(hash === DATA.admin.hash){
      UI.admin.authed = true; UI.admin.loginError=''; touchActivity(); render();
    } else {
      UI.admin.loginError = 'Senha incorreta.'; render();
    }
  });

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ UI.admin.authed = false; render(); });

  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click', (e)=>{
    e.preventDefault(); touchActivity(); UI.admin.tab = el.dataset.tab; render();
  }));

  /* dashboard/agenda actions */
  document.querySelectorAll('[data-bk-status]').forEach(el=>el.addEventListener('click', ()=>{
    const [id,status] = el.dataset.bkStatus.split('|');
    const bk = DATA.bookings.find(b=>b.id===id);
    if(bk){ bk.status = status; persist(); toast('Agendamento atualizado.'); render(); }
  }));
  document.querySelectorAll('[data-bk-cancel]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Cancelar este agendamento? O horário será liberado.')) return;
    const bk = DATA.bookings.find(b=>b.id===el.dataset.bkCancel);
    if(bk){ bk.status = 'cancelled'; persist(); toast('Agendamento cancelado.'); render(); }
  }));
  document.querySelectorAll('[data-bk-contact]').forEach(el=>el.addEventListener('click', ()=>{
    const bk = DATA.bookings.find(b=>b.id===el.dataset.bkContact);
    if(bk){ bk.contacted = !bk.contacted; persist(); render(); }
  }));
  document.querySelectorAll('[data-bk-view]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.selectedBookingId = el.dataset.bkView; UI.admin.reschedule = null; render();
  }));
  const bkCloseDetail = document.getElementById('bkCloseDetail');
  if(bkCloseDetail) bkCloseDetail.addEventListener('click', ()=>{ UI.admin.selectedBookingId=null; UI.admin.reschedule=null; render(); });

  document.querySelectorAll('[data-agenda-view]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.agendaView = el.dataset.agendaView; render();
  }));
  document.querySelectorAll('[data-week-day]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.agendaWeekDay = el.dataset.weekDay; render();
  }));

  const agendaSearch = document.getElementById('agendaSearch');
  if(agendaSearch) agendaSearch.addEventListener('input', ()=>{ UI.admin.agendaSearch = agendaSearch.value; render(); agendaSearch.focus(); agendaSearch.setSelectionRange(agendaSearch.value.length,agendaSearch.value.length); });

  /* reschedule */
  document.querySelectorAll('[data-bk-reschedule]').forEach(el=>el.addEventListener('click', ()=>{
    const bk = DATA.bookings.find(b=>b.id===el.dataset.bkReschedule);
    UI.admin.reschedule = {bookingId:bk.id, serviceId:bk.serviceId, date:bk.date, time:null};
    render();
  }));
  const rsService = document.getElementById('rsService');
  if(rsService) rsService.addEventListener('change', ()=>{ UI.admin.reschedule.serviceId = rsService.value; UI.admin.reschedule.time=null; render(); });
  const rsDate = document.getElementById('rsDate');
  if(rsDate) rsDate.addEventListener('change', ()=>{ UI.admin.reschedule.date = rsDate.value; UI.admin.reschedule.time=null; render(); });
  const rsSearchBtn = document.getElementById('rsSearchBtn');
  if(rsSearchBtn) rsSearchBtn.addEventListener('click', ()=>{
    UI.admin.reschedule.date = document.getElementById('rsDate').value;
    UI.admin.reschedule.serviceId = document.getElementById('rsService').value;
    if(!UI.admin.reschedule.date){ toast('Escolha uma data.'); return; }
    render();
  });
  document.querySelectorAll('[data-rs-time]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.reschedule.time = el.dataset.rsTime; render();
  }));
  const rsSaveBtn = document.getElementById('rsSaveBtn');
  if(rsSaveBtn) rsSaveBtn.addEventListener('click', ()=>{
    const rs = UI.admin.reschedule;
    const service = DATA.services.find(s=>s.id===rs.serviceId);
    const valid = generateSlots(rs.date, service, rs.bookingId);
    if(!rs.time || !valid.includes(rs.time)){ toast('Esse horário não está mais disponível. Escolha outro.'); render(); return; }
    const bk = DATA.bookings.find(b=>b.id===rs.bookingId);
    bk.serviceId = rs.serviceId; bk.date = rs.date; bk.time = rs.time; bk.status = 'confirmed';
    persist(); UI.admin.reschedule = null; toast('Agendamento remarcado.'); render();
  });
  const rsCancelBtn = document.getElementById('rsCancelBtn');
  if(rsCancelBtn) rsCancelBtn.addEventListener('click', ()=>{ UI.admin.reschedule = null; render(); });

  /* manual booking mini-flow */
  const manualName = document.getElementById('manualName');
  if(manualName) manualName.addEventListener('input', ()=>{ UI.admin.manual.name = manualName.value; });
  const manualPhone = document.getElementById('manualPhone');
  if(manualPhone) manualPhone.addEventListener('input', ()=>{
    UI.admin.manual.phone = manualPhone.value;
    const digits = onlyDigits(manualPhone.value);
    if(digits.length>=10 && DATA.clients[digits] && !manualName.value){
      manualName.value = DATA.clients[digits].name; UI.admin.manual.name = DATA.clients[digits].name;
    }
  });
  const manualService = document.getElementById('manualService');
  if(manualService) manualService.addEventListener('change', ()=>{ UI.admin.manual.serviceId = manualService.value; UI.admin.manual.time=null; render(); });
  const manualDate = document.getElementById('manualDate');
  if(manualDate) manualDate.addEventListener('change', ()=>{ UI.admin.manual.date = manualDate.value; UI.admin.manual.time=null; render(); });
  const manualSearchBtn = document.getElementById('manualSearchBtn');
  if(manualSearchBtn) manualSearchBtn.addEventListener('click', ()=>{
    UI.admin.manual.serviceId = document.getElementById('manualService').value;
    UI.admin.manual.date = document.getElementById('manualDate').value;
    if(!UI.admin.manual.serviceId || !UI.admin.manual.date){ toast('Escolha o serviço e a data.'); return; }
    render();
  });
  document.querySelectorAll('[data-manual-time]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.manual.time = el.dataset.manualTime; render();
  }));
  const manualAddBtn = document.getElementById('manualAddBtn');
  if(manualAddBtn) manualAddBtn.addEventListener('click', ()=>{
    const m = UI.admin.manual;
    const service = DATA.services.find(s=>s.id===m.serviceId);
    const name = m.name.trim();
    const phone = onlyDigits(m.phone);
    if(!name || phone.length<10 || !service || !m.date || !m.time){ toast('Preencha nome, telefone, serviço, data e horário.'); return; }
    const valid = generateSlots(m.date, service);
    if(!valid.includes(m.time)){ toast('Esse horário não está mais disponível.'); render(); return; }
    DATA.bookings.push({id:uid(), serviceId:service.id, barber:null, date:m.date, time:m.time, name, phone, status:'confirmed', contacted:false, createdAt:Date.now()});
    DATA.clients[phone] = {name, phone};
    persist();
    UI.admin.manual = {name:'', phone:'', serviceId:'', date:'', time:null};
    toast('Agendamento criado.'); render();
  });

  const blockAddBtn = document.getElementById('blockAddBtn');
  if(blockAddBtn) blockAddBtn.addEventListener('click', ()=>{
    const date = document.getElementById('blockDate').value;
    const start = document.getElementById('blockStart').value;
    const end = document.getElementById('blockEnd').value;
    const reason = document.getElementById('blockReason').value.trim();
    if(!date||!start||!end){ toast('Preencha data, início e fim.'); return; }
    DATA.blocks.push({id:uid(), date, start, end, reason});
    persist(); toast('Horário bloqueado.'); render();
  });
  document.querySelectorAll('[data-block-remove]').forEach(el=>el.addEventListener('click', ()=>{
    DATA.blocks = DATA.blocks.filter(b=>b.id!==el.dataset.blockRemove); persist(); render();
  }));
  const closedDateAdd = document.getElementById('closedDateAdd');
  if(closedDateAdd) closedDateAdd.addEventListener('click', ()=>{
    const d = document.getElementById('closedDateInput').value;
    if(!d){ toast('Escolha uma data.'); return; }
    if(!DATA.closedDates.includes(d)) DATA.closedDates.push(d);
    persist(); render();
  });
  document.querySelectorAll('[data-closed-remove]').forEach(el=>el.addEventListener('click', ()=>{
    DATA.closedDates = DATA.closedDates.filter(d=>d!==el.dataset.closedRemove); persist(); render();
  }));

  /* services */
  const svcNewBtn = document.getElementById('svcNewBtn');
  if(svcNewBtn) svcNewBtn.addEventListener('click', ()=>{ UI.admin.editingServiceId='new'; render(); });
  document.querySelectorAll('[data-svc-edit]').forEach(el=>el.addEventListener('click', ()=>{ UI.admin.editingServiceId = el.dataset.svcEdit; render(); }));
  document.querySelectorAll('[data-svc-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const s = DATA.services.find(x=>x.id===el.dataset.svcToggle); s.active = !s.active; persist(); render();
  }));
  document.querySelectorAll('[data-svc-delete]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Excluir este serviço?')) return;
    DATA.services = DATA.services.filter(x=>x.id!==el.dataset.svcDelete); persist(); render();
  }));
  const svcCancelBtn = document.getElementById('svcCancelBtn');
  if(svcCancelBtn) svcCancelBtn.addEventListener('click', ()=>{ UI.admin.editingServiceId=null; render(); });
  const svcSaveBtn = document.getElementById('svcSaveBtn');
  if(svcSaveBtn) svcSaveBtn.addEventListener('click', ()=>{
    const name = document.getElementById('svcName').value.trim();
    const category = document.getElementById('svcCategory').value;
    const price = parseFloat(document.getElementById('svcPrice').value);
    const duration = parseInt(document.getElementById('svcDuration').value,10);
    const priceFrom = document.getElementById('svcPriceFrom').checked;
    const description = document.getElementById('svcDesc').value.trim();
    if(!name || isNaN(price) || isNaN(duration)){ toast('Preencha nome, preço e duração corretamente.'); return; }
    if(UI.admin.editingServiceId==='new'){
      DATA.services.push({id:uid(), name, description, category, price, priceFrom, duration, active:true});
    } else {
      const s = DATA.services.find(x=>x.id===UI.admin.editingServiceId);
      Object.assign(s, {name, description, category, price, priceFrom, duration});
    }
    persist(); UI.admin.editingServiceId=null; toast('Serviço salvo.'); render();
  });

  /* clients */
  document.querySelectorAll('[data-client-view]').forEach(el=>el.addEventListener('click', ()=>{
    UI.admin.editingClientPhone = el.dataset.clientView; render();
  }));

  /* config */
  const cfgSaveInfoBtn = document.getElementById('cfgSaveInfoBtn');
  if(cfgSaveInfoBtn) cfgSaveInfoBtn.addEventListener('click', ()=>{
    DATA.config.whatsapp = document.getElementById('cfgWhats').value.trim();
    DATA.config.instagram = document.getElementById('cfgInsta').value.trim();
    DATA.config.address = document.getElementById('cfgAddress').value.trim();
    DATA.config.foundedYear = parseInt(document.getElementById('cfgFounded').value,10) || DATA.config.foundedYear;
    DATA.config.tagline = document.getElementById('cfgTagline').value.trim();
    DATA.config.about = document.getElementById('cfgAbout').value.trim();
    DATA.config.barbers = document.getElementById('cfgBarbers').value.split(',').map(s=>s.trim()).filter(Boolean);
    persist(); toast('Informações salvas.'); render();
  });

  document.querySelectorAll('[data-day] input[data-hour-field="closed"]').forEach(el=>el.addEventListener('change', ()=>{
    const row = el.closest('[data-day]');
    row.querySelectorAll('input[type="time"]').forEach(t=>t.disabled = el.checked);
  }));
  const cfgSaveHoursBtn = document.getElementById('cfgSaveHoursBtn');
  if(cfgSaveHoursBtn) cfgSaveHoursBtn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-day]').forEach(row=>{
      const k = row.dataset.day;
      const closed = row.querySelector('[data-hour-field="closed"]').checked;
      const open = row.querySelector('[data-hour-field="open"]').value;
      const close = row.querySelector('[data-hour-field="close"]').value;
      const breakStart = row.querySelector('[data-hour-field="breakStart"]').value;
      const breakEnd = row.querySelector('[data-hour-field="breakEnd"]').value;
      DATA.config.hours[k] = {closed, open, close, breakStart, breakEnd};
    });
    persist(); toast('Horários salvos.'); render();
  });

  const cfgPassBtn = document.getElementById('cfgPassBtn');
  if(cfgPassBtn) cfgPassBtn.addEventListener('click', async ()=>{
    const p1 = document.getElementById('cfgNewPass').value;
    const p2 = document.getElementById('cfgNewPass2').value;
    const msg = document.getElementById('cfgPassMsg');
    if(p1.length < 4){ msg.textContent='Use ao menos 4 caracteres.'; return; }
    if(p1 !== p2){ msg.textContent='As senhas não coincidem.'; return; }
    const salt = uid()+uid();
    const hash = await sha256Hex(salt+p1);
    DATA.admin = {salt, hash};
    persist();
    msg.style.color = 'var(--ok)';
    msg.textContent = 'Senha alterada com sucesso.';
  });
}
</script>
</body>
</html>
